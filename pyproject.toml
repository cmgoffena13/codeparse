[project]
name = "codeparse"
version = "0.1.29"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.7.22",
    "fastmcp>=4.1.0",
    "nuitka[onefile]>=4.0.8",
    "pathspec>=1.1.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "xxhash>=4.0.1",
]

[dependency-groups]
dev = [
    "prek>=0.5.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "cursor-sdk>=1.0.32",
    "claude-agent-sdk>=0.1.59",
    "python-dotenv>=1.2.3",
]

[tool.pytest.ini_options]
testpaths = [ "src/tests" ]
pythonpath = [ "." ]

[tool.coverage.run]
omit = ["src/tests/*"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
target-version = "py312"
extend-exclude = ["src/tests/files_to_parse/"]
line-length = 100
force-exclude = true
lint.extend-select = [
    "A",     # Builtins
    "AIR",   # Optional: Airflow
    "FAST",  # Optional: FastApi
    "DTZ",   # Datetime
    "SIM",   # Simplify
    "I",     # Isort Imports
    "S",     # Bandit
    "PT",    # Pytest
    "B",     # BugBear
    "N",     # Naming Conventions
    "RUF",   # Ruff Specific Rules
    "PTH",   # Pathlib
    "ARG",   # Unused Args
    "C4",    # Force Current List Comprehensions
    "RET",   # Return Checks
    "E501",  # Line Too Long
    "ANN401" # No 'Any'
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "S607"]
"_assertions.py" = ["S101"]
"eval/bench.py" = ["S603", "S607", "EXE001", "ANN401"]

[tool.ty.src]
exclude = ["src/tests/files_to_parse/"]

[tool.uv.sources]
tree-sitter = { git = "https://github.com/tree-sitter/py-tree-sitter" }
